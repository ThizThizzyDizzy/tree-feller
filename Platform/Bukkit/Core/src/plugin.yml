main: com.thizthizzydizzy.treefeller.platform.bukkit.core.connector.TreeFellerBukkitBootstrap
version: 2.0.0
api-version: 1.13
name: treefeller
softdepend: [mcautotester]
folia-supported: true

commands:
  treefeller:
    description: TreeFeller controls and configuration
    usage: /treefeller <help|toggle|on|off|reload|debug|config>
permissions:
  treefeller.debug:
    description: Control your TreeFeller debug trace
    default: op
  treefeller.help:
    default: true
  treefeller.toggle:
    default: true
  treefeller.reload:
    default: op
  treefeller.config:
    default: op
