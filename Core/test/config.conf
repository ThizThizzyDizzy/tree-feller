debug {
    // List all loaded configuration values in the console during startup
    startup_logs = true

}
global {
    // This section defines when TreeFeller can start searching for a tree
    trigger {
        // Whether TreeFeller should be toggled on by default (per-player toggle)
        default_enabled = true


        // Minimum time, in ticks, between felling trees. (per player)
        #cooldown = 


        // Permissions required to fell trees
        #permissions = 


        // Food level required to fell trees
        #food = 


        // Saturation level required to fell trees
        #saturation = 


        // Health required to fell trees
        #health = 


        // Allow felling trees in adventure mode
        adventure_mode = false


        // Allow felling trees in survival mode
        survival_mode = true


        // Allow felling trees in creative mode
        creative_mode = false


        // Allow felling trees while sneaking
        with_sneaking = false


        // Allow felling trees while not sneaking
        without_sneaking = true


        // The time of day when tree felling is allowed, in ticks (0-24000)
        #day_time = 


        // The moon phases where tree felling is allowed, (0-7, where 0 is a full moon, and 7 is a waxing gibbous)
        #moon_phase = 


        // Dimensions where tree felling is allowed
        #dimensions = 


        // Biomes where tree felling is allowed
        #biomes = 

    }


    // This section defines how TreeFeller searches for all the blocks in a tree.
    detection {
        // The maximum distance to check for a tree trunk when breaking roots
        root_distance = 6


        // The maximum distance between disconnected trunk sections, connected by leaves
        disconnected_trunk_distance = 0


        // The maximum distance from the trunk that leaves will be searched for
        leaf_detect_range = 6


        // Allow leaves to be detected diagonally
        diagonal_leaves = false


        // Special detection rules for block data / metadata
        block_data_rules {
            // When scanning tree trunks, avoid connecting parallel adjacent tree trunks. This may cause issues with 2x2 trees or trees with branches.
            ignore_parallel_trunk_pillars = false


            // Use leaf block data (distance) to speed up leaf detection
            use_leaf_distance = true

        }


        // Decorations that should be considered part of a tree
        #decorations = 

    }


    // This section defines how TreeFeller decides if a given detection is a tree or not.
    criteria {
        // The minimum number of total trunk blocks required
        required_trunk = 4


        // The minimum number of total leaves required
        required_leaves = 10


        // The maximum number of total trunk blocks allowed
        max_trunk = 256


        // The maximum distance from the base of the trunk that a tree may be cut
        max_height = 5


        // Allow a tool to fully cut down a tree, even with insufficient durability
        allow_partial_tool = true


        // Prevent felling a tree if doing so would break the tool
        prevent_breakage = false


        // Require a full horizontal cross-section of the tree trunk to be broken before felling the tree
        require_cross_section = false


        // This filter applies to the tree trunk
        // Blocks in this filter MUST also be present in the tree trunk in detection settings.
        #trunk_filter = 


        // This filter applies to the tree leaves
        // Blocks in this filter MUST also be present in the tree leaves in detection settings.
        #leaf_filter = 


        // This filter applies to the tree decorations
        // Blocks in this filter MUST also be present in the tree decorations in detection settings.
        #decoration_filter = 


        // The maximum length of a straight horizontal line of trunk blocks that may be present in a tree
        trunk_max_horizontal_line = 6


        // The maximum number of trunks that a tree may have.
        #max_trunks = 


        // This range constrains the ratio of height to width of a tree
        #height_ratio = 


        // This range constrains the ratio of vertical logs to horizontal logs in a tree. (This includes all pillar-type blocks, i.e. axis=x/y/z)
        vertical_ratio {
            min = 0.5
            #max = 
        }

    }


    // This section defines how a tree is cut
    cutting {
        // Leave the tree stump (any blocks below the one that was cut)
        leave_stump = false


        // The maximum distance from the trunk that leaves will be broken
        leaf_break_range = 6


        // The maximum number of trunk blocks that can be cut down at once
        #partial_trunk_limit = 


        // Allow trees to be partially cut down, either from insufficient tool durability, or from other settings
        allow_partial = false


        // Cut down the tree with an animation, rather than all at once
        cutting_animation = false


        // Animation delay, in game ticks
        #animation_delay = 

    }


    // This section defines how blocks are broken
    breaking {
        // How the tree trunk should be felled
        trunk_behavior {
            // Attempt to lay the tree down naturally
            natural = false


            // Fall as falling block entities, rather than breaking in-place
            fall_as_entities = false


            // The damage falling blocks should deal, per block fallen
            fall_damage_amount = 0.0


            // The maximum damage falling blocks can deal
            fall_damage_maximum = 40.0

        }


        // How the tree leaves should be felled
        leaves_behavior {
            // Attempt to lay the tree down naturally
            natural = false


            // Fall as falling block entities, rather than breaking in-place
            fall_as_entities = false


            // The damage falling blocks should deal, per block fallen
            fall_damage_amount = 0.0


            // The maximum damage falling blocks can deal
            fall_damage_maximum = 40.0

        }


        // How the tree decorations should be felled
        decoration_behavior {
            // Attempt to lay the tree down naturally
            natural = false


            // Fall as falling block entities, rather than breaking in-place
            fall_as_entities = false


            // The damage falling blocks should deal, per block fallen
            fall_damage_amount = 0.0


            // The maximum damage falling blocks can deal
            fall_damage_maximum = 40.0

        }


        // The direction that trees should fall
        fall_direction = RANDOM


        // The yaw rotation for where trees should fall, in degrees. Applies to FIXED and RELATIVE fall directions.
        // For FIXED fall direction, 0 = North, 90 = east, etc.
        // For RELATIVE fall direction, 0 = forwards (away from the player), 90 = to the right, etc.
        fall_direction_yaw = 0.0


        // Force falling trees to fall in the closest cardinal direction (N/S/E/W)
        fall_cardinal = false


        // Horizontal velocity applied to falling tree blocks, in the tree's falling direction
        directional_fall_velocity = 0.35


        // Upward vertical velocity applied to falling tree blocks
        vertical_fall_velocity = 0.05


        // Horizontal velocity applied to falling tree blocks, away from the block that was cut
        explosive_fall_velocity = 0.0


        // Horizontal velocity applied to each falling tree block, in a random direction
        random_fall_velocity = 0.0


        // Extra delay, in ticks, between breaking a block and spawning falling block entities.
        // (This should be left at 0 unless you have issues with blocks colliding with an in-progress cutting animation)
        fall_delay = 0


        // Convert these blocks instead of breaking them
        #block_conversions = 

    }


    // This section defines the results after felling a tree
    result {
        // Replant saplings after a tree is felled
        sapling_replant {
            enable = false

            // Use saplings dropped from the tree leaves to replant trees
            use_tree_saplings = true


            // Use saplings from the player inventory to replant trees
            use_inventory_saplings = false


            // Spawn saplings to replant if not enough are available
            spawn_saplings = false


            // The maximum time, in game ticks, to wait for saplings before giving up
            sapling_timeout = 50


            // The blocks that saplings may be planted on
            #grasses = 

        }


        // Blocks that can be overridden if a falling block lands on them
        #overrideable_blocks = 


        // Reduce damage taken for tools with Unbreaking
        respect_unbreaking = true


        // Deal no damage to unbreakable tools
        respect_unbreakable = true


        // Damage dealt to the tool per block in the tree trunk
        trunk_damage_mult = 1.0


        // Damage dealt to the tool per block in the tree leaves
        leaves_damage_mult = 0.0


        // Damage dealt to the tool per block in the tree decorations
        decorations_damage_mult = 0.0


        // Consume stacked tools one at a time. (The entire stack will be treated as one tool)
        // WARNING: Using stacked tools is not recommended!
        stacked_tools = false


        // Apply the tool's Fortune to drops from the trunk
        trunk_fortune = true


        // Apply the tool's Fortune to drops from the leaves
        leaves_fortune = true


        // Apply the tool's Fortune to drops from the decorations
        decoration_fortune = false


        // Apply the tool's Silk Touch to drops from the trunk
        trunk_silk_touch = true


        // Apply the tool's Silk Touch to drops from the leaves
        leaves_silk_touch = true


        // Apply the tool's Silk Touch to drops from the decorations
        decoration_silk_touch = false


        // Rotate falling pillar blocks (axis=x/y/z) as they fall
        rotate_logs = true


        // Convert block drops into other items when felling
        #drop_conversions = 


        // Place dropped items directly in the player inventory
        drop_to_inventory = false


        // Chance of trunk dropping items. Values higher than 1 will multiply drops
        trunk_drop_chance = 1.0


        // Chance of leaves dropping items. Values higher than 1 will multiply drops
        leaves_drop_chance = 1.0


        // Chance of decorations dropping items. Values higher than 1 will multiply drops
        decorations_drop_chance = 1.0


        // Effects to apply to falling trees
        #effects = 


        // Base food consumed per tree felled
        consumed_food_base = 0.0


        // Food consumed per trunk block felled
        consumed_food_trunk = 0.0


        // Food consumed per leaf block felled
        consumed_food_leaves = 0.0


        // Food consumed per decoration block felled
        consumed_food_decoration = 0.0


        // Base health consumed per tree felled
        consumed_health_base = 0.0


        // Health consumed per trunk block felled
        consumed_health_trunk = 0.0


        // Health consumed per leaf block felled
        consumed_health_leaves = 0.0


        // Health consumed per decoration block felled
        consumed_health_decoration = 0.0


        // Cascade tree felling to other trees connected through leaves
        cascade {
            enable = false

            // The maximum number of trees that may be felling at once from a single cascade
            parallel_cascade_limit = 1


            // The maximum number of cascade checks that may happen in a single tick
            cascade_check_limit = 64

        }

    }

}
